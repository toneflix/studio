<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Toneflix Studio demo</title>
    <style>
      body { margin: 0; background: #0d0d0f; color: #e8e8ea; font: 13px system-ui, sans-serif; }
      header { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; padding: 4px 12px; background: #18181b; }
      header strong { margin-right: 4px; }
      body { display: flex; flex-direction: column; height: 100vh; }
      main { display: flex; flex: 1; min-height: 0; }
      #timeline { flex: 1; min-width: 0; }
    </style>
  </head>
  <body>
    <header>
      <strong>Toneflix Studio</strong>
      <div id="toolbar"></div>
    </header>
    <main id="workspace">
      <div id="timeline"></div>
    </main>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
