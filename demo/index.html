<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Toneflix Studio demo</title>
    <style>
      body { margin: 0; background: #0d0d0f; color: #e8e8ea; font: 13px system-ui, sans-serif; }
      header { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; padding: 10px 12px; }
      header strong { margin-right: 8px; }
      button, select { background: #222228; color: inherit; border: 1px solid #33333a; border-radius: 6px; padding: 5px 10px; font: inherit; }
      button:disabled { opacity: 0.4; }
      #info { margin-left: auto; color: #9a9aa2; }
      #timeline { height: calc(100vh - 54px); }
    </style>
  </head>
  <body>
    <header>
      <strong>Toneflix Studio</strong>
      <button id="split">Split (S)</button>
      <button id="duplicate">Duplicate</button>
      <button id="delete">Delete</button>
      <button id="undo">Undo</button>
      <button id="redo">Redo</button>
      <button id="zoom-out">−</button>
      <button id="fit">Fit</button>
      <button id="zoom-in">+</button>
      <select id="snap">
        <option value="off">No snap</option>
        <option value="bar">Bar</option>
        <option value="beat" selected>Beat</option>
        <option value="1/8">1/8</option>
        <option value="1/16">1/16</option>
      </select>
      <span id="info"></span>
    </header>
    <div id="timeline"></div>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
